<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f5">
<title>XO — VAB Dev</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light;--bg:#f5f5f5;--surface:#fff;--surface2:#fafafa;--text:#242424;--muted:#616161;--line:#e5e5e5;--accent:#0f6cbd;--accent2:#115ea3;--blue-soft:#e8f3fc;--red:#c239b3;--green:#107c10;--shadow:0 2px 8px #0000000d,0 12px 30px #0000000a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"Segoe UI",sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}.topbar{height:72px;background:#ffffffd9;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1080px)/2));position:sticky;top:0;z-index:2}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}.brand img{width:42px;height:42px;object-fit:contain;border-radius:12px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}.top-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:white;border-radius:10px;width:40px;height:40px;color:#444;font-size:17px}
main{width:min(100% - 32px,1000px);margin:42px auto 36px;flex:1}.hero{text-align:center;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.8px;margin:9px 0 8px}.hero p{color:var(--muted);margin:0;font-size:15px}
.layout{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px}.panel h2{font-size:16px;margin:0 0 16px;letter-spacing:-.3px}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;background:#f0f0f0;padding:4px;border-radius:12px;gap:4px}.mode-switch button{border:0;background:transparent;border-radius:9px;padding:11px 8px;color:#555;font-size:13px;font-weight:600}.mode-switch button.active{background:#fff;color:var(--accent);box-shadow:0 1px 4px #00000018}
.player-fields{display:grid;gap:12px;margin-top:18px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}.field input{width:100%;height:42px;border:1px solid #d1d1d1;border-radius:8px;padding:0 12px;font:inherit;font-size:14px;outline:none;background:white}.field input:focus{border:2px solid var(--accent);padding-left:11px}
.score-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.score-title h2{margin:0}.reset-link{border:0;background:none;color:var(--accent);font-size:12px;font-weight:700}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score{background:var(--surface2);border:1px solid var(--line);border-radius:12px;text-align:center;padding:12px 5px}.score span{display:block;font-size:11px;color:var(--muted);font-weight:600}.score strong{display:block;font-size:25px;margin-top:5px;font-variant-numeric:tabular-nums}.score.x strong{color:var(--accent)}.score.o strong{color:var(--red)}.score.draw strong{color:#777}
.game-panel{padding:22px}.game-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.turn{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}.turn-mark{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--accent);display:grid;place-items:center;font-size:17px;font-weight:800}.turn-mark.o{background:#fbeafa;color:var(--red)}.status{font-size:11px;color:var(--muted);background:#f5f5f5;padding:7px 10px;border-radius:20px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1px solid #e2e2e2;background:#fafafa;border-radius:15px;display:grid;place-items:center;font-size:clamp(42px,8vw,68px);font-weight:700;transition:background .15s,border-color .15s,transform .15s;color:var(--accent)}.cell:hover:enabled{background:#f0f6fc;border-color:#9cc7eb;transform:translateY(-2px)}.cell.o{color:var(--red)}.cell:disabled{cursor:default}.cell.win{background:#eaf6ea;border-color:#6bbd6b}.game-actions{display:flex;justify-content:center;gap:9px;margin-top:20px}.primary,.secondary{border-radius:9px;padding:11px 18px;font-size:13px;font-weight:700}.primary{background:var(--accent);border:1px solid var(--accent);color:white}.primary:hover{background:var(--accent2)}.secondary{background:white;border:1px solid #d1d1d1;color:#333}.secondary:hover{background:#f5f5f5}
.result{min-height:24px;text-align:center;margin:14px 0 0;color:var(--muted);font-size:13px;font-weight:600}.result strong{color:var(--green)}
footer{text-align:center;border-top:1px solid var(--line);padding:22px 16px;color:var(--muted);font-size:12px;line-height:1.8}footer a{color:var(--accent);text-decoration:none;font-weight:700}footer a:hover{text-decoration:underline}.footer-name{color:#333;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#242424;color:white;padding:11px 16px;border-radius:10px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){main{margin:28px auto}.layout{grid-template-columns:1fr}.panel{padding:18px}.hero{margin-bottom:22px}.game-panel{order:-1}.topbar{height:64px}.board{max-width:390px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main>
  <section class="hero"><div class="eyebrow">A little friendly competition</div><h1>XO Challenge</h1><p>Choose your mode, make your move, and own the board.</p></section>
  <div class="layout">
    <section class="panel">
      <h2>Game settings</h2>
      <div class="mode-switch" role="tablist" aria-label="Game mode">
        <button id="computerMode" class="active" role="tab" aria-selected="true">Vs. Computer</button>
        <button id="twoMode" role="tab" aria-selected="false">Two Players</button>
      </div>
      <div class="field" id="difficultyField" style="margin-top:16px">
        <label for="difficulty">Computer difficulty</label>
        <select id="difficulty" style="width:100%;height:42px;border:1px solid #d1d1d1;border-radius:8px;padding:0 12px;font:inherit;font-size:14px;background:white;color:#242424">
          <option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option>
        </select>
      </div>
      <div class="player-fields">
        <div class="field"><label for="playerX">Player X</label><input id="playerX" maxlength="18" value="You"></div>
        <div class="field" id="opponentField"><label for="playerO">Opponent</label><input id="playerO" maxlength="18" value="Computer"></div>
      </div>
      <div class="score-title"><h2>Scoreboard</h2><button class="reset-link" id="resetScores">Reset scores</button></div>
      <div class="scores">
        <div class="score x"><span id="scoreXName">YOU · X</span><strong id="scoreX">0</strong></div>
        <div class="score draw"><span>DRAWS</span><strong id="scoreDraw">0</strong></div>
        <div class="score o"><span id="scoreOName">COMPUTER · O</span><strong id="scoreO">0</strong></div>
      </div>
    </section>
    <section class="panel game-panel">
      <div class="game-head"><div class="turn"><span class="turn-mark" id="turnMark">X</span><span id="turnText">Your turn</span></div><span class="status" id="modeLabel">VS COMPUTER</span></div>
      <div class="board" id="board" role="grid" aria-label="Tic tac toe board">
        <button class="cell" data-i="0" aria-label="Top left"></button><button class="cell" data-i="1" aria-label="Top center"></button><button class="cell" data-i="2" aria-label="Top right"></button>
        <button class="cell" data-i="3" aria-label="Middle left"></button><button class="cell" data-i="4" aria-label="Center"></button><button class="cell" data-i="5" aria-label="Middle right"></button>
        <button class="cell" data-i="6" aria-label="Bottom left"></button><button class="cell" data-i="7" aria-label="Bottom center"></button><button class="cell" data-i="8" aria-label="Bottom right"></button>
      </div>
      <div class="result" id="result" aria-live="polite">The first move is yours.</div>
      <div class="game-actions"><button class="primary" id="newGame">New game</button><button class="secondary" id="undo">Undo move</button></div>
    </section>
  </div>

<script>
(() => {
const $=id=>document.getElementById(id);
const cells=[...document.querySelectorAll('.cell')];
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let mode='computer',board=Array(9).fill(''),turn='X',over=false,history=[],sound=true;
let scores={X:0,O:0,D:0};
try{const saved=JSON.parse(localStorage.getItem('vab-xo-scores')||'null');if(saved&&['X','O','D'].every(k=>Number.isFinite(saved[k])))scores=saved;}catch{}
const nameX=()=> $('playerX').value.trim()||'Player X';
const nameO=()=>mode==='computer'?'Computer':($('playerO').value.trim()||'Player O');
function persist(){localStorage.setItem('vab-xo-scores',JSON.stringify(scores));}
function showScores(){$('scoreX').textContent=scores.X;$('scoreO').textContent=scores.O;$('scoreDraw').textContent=scores.D;$('scoreXName').textContent=(mode==='computer'?'YOU':nameX()).toUpperCase()+' · X';$('scoreOName').textContent=nameO().toUpperCase()+' · O';}
function sayToast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800);}
function beep(freq=520){if(!sound)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08);o.onended=()=>ctx.close();}catch{}}
function winner(b=board){for(const line of wins){const [a,c,d]=line;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {mark:b[a],line};}return null;}
function draw(){return board.every(Boolean);}
function render(){
 cells.forEach((el,i)=>{el.textContent=board[i];el.classList.toggle('o',board[i]==='O');el.classList.remove('win');el.disabled=over||!!board[i]||(mode==='computer'&&turn==='O');el.setAttribute('aria-label',`Cell ${i+1}${board[i]?', '+board[i]:', empty'}`);});
 const w=winner();if(w)w.line.forEach(i=>cells[i].classList.add('win'));
 $('turnMark').textContent=over?'✓':turn;$('turnMark').classList.toggle('o',turn==='O'&&!over);
 $('turnText').textContent=over?'Round complete':(turn==='X'?nameX()+' — your turn':(mode==='computer'?'Computer is thinking…':nameO()+' — your turn'));
 showScores();
}
function finish(){
 const w=winner();
 if(w){over=true;scores[w.mark]++;persist();$('result').innerHTML='<strong>'+escapeHtml(w.mark==='X'?nameX():nameO())+' wins!</strong> Great game.';beep(760);}
 else if(draw()){over=true;scores.D++;persist();$('result').textContent="It's a draw. Well played!";beep(360);}
 render();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function move(i,computer=false){if(over||board[i]||(mode==='computer'&&turn==='O'&&!computer))return;history.push({board:board.slice(),turn});board[i]=turn;beep(turn==='X'?540:430);if(winner()||draw()){finish();return;}turn=turn==='X'?'O':'X';$('result').textContent='';render();if(mode==='computer'&&turn==='O')setTimeout(computerMove,380);}
function evaluateBoard(b){
 const w=winner(b);
 if(w)return w.mark==='O'?100:-100;
 let score=0;
 // Open two-in-a-row threats are valuable; blocked lines contribute nothing.
 for(const line of wins){
   const marks=line.map(i=>b[i]);
   const os=marks.filter(v=>v==='O').length, xs=marks.filter(v=>v==='X').length;
   if(xs===0){if(os===2)score+=12;else if(os===1)score+=2;}
   if(os===0){if(xs===2)score-=14;else if(xs===1)score-=2;}
 }
 if(b[4]==='O')score+=3; else if(b[4]==='X')score-=3;
 for(const i of [0,2,6,8]){if(b[i]==='O')score+=1;else if(b[i]==='X')score-=1;}
 return score;
}
// Alpha-beta minimax. O is the computer; X is the human.
// A depth limit gives Medium a strategic but beatable search; Hard searches to the end.
function searchMove(b,player,depth,maxDepth,alpha,beta){
 const w=winner(b);
 if(w)return w.mark==='O'?100-depth:depth-100;
 if(b.every(Boolean))return 0;
 if(depth>=maxDepth)return evaluateBoard(b);
 if(player==='O'){
   let best=-Infinity;
   for(let i=0;i<9;i++)if(!b[i]){
     b[i]='O';best=Math.max(best,searchMove(b,'X',depth+1,maxDepth,alpha,beta));b[i]='';
     alpha=Math.max(alpha,best);if(beta<=alpha)break;
   }
   return best;
 }else{
   let best=Infinity;
   for(let i=0;i<9;i++)if(!b[i]){
     b[i]='X';best=Math.min(best,searchMove(b,'O',depth+1,maxDepth,alpha,beta));b[i]='';
     beta=Math.min(beta,best);if(beta<=alpha)break;
   }
   return best;
 }
}
function chooseSearchMove(maxDepth){
 let best=-Infinity,choices=[];
 // Prefer center/corners only as tie-breakers, while still allowing all legal moves.
 const order=[4,0,2,6,8,1,3,5,7];
 for(const i of order)if(!board[i]){
   board[i]='O';
   const score=searchMove(board,'X',1,maxDepth,-Infinity,Infinity);
   board[i]='';
   if(score>best){best=score;choices=[i];}
   else if(score===best)choices.push(i);
 }
 return choices[Math.floor(Math.random()*choices.length)];
}
function computerMove(){
 if(over||mode!=='computer'||turn!=='O')return;
 const available=board.map((v,i)=>v?-1:i).filter(i=>i>=0);
 if(!available.length)return;
 const level=$('difficulty').value;
 let pick;
 if(level==='easy'){
   // Easy deliberately makes casual mistakes, but takes a win occasionally.
   const winning=available.filter(i=>{board[i]='O';const yes=!!winner();board[i]='';return yes;});
   pick=winning.length&&Math.random()<0.35
     ?winning[Math.floor(Math.random()*winning.length)]
     :available[Math.floor(Math.random()*available.length)];
 }else if(level==='medium'){
   // Look ahead several plies: tactical threats, forks, and positional play.
   pick=chooseSearchMove(4);
 }else{
   // Full-depth alpha-beta search: optimal play, cannot lose in standard tic-tac-toe.
   pick=chooseSearchMove(9);
 }
 if(pick!==undefined)move(pick,true);
}
function newGame(){board=Array(9).fill('');turn='X';over=false;history=[];$('result').textContent='The first move is yours.';render();}
function setMode(next){mode=next;$('computerMode').classList.toggle('active',mode==='computer');$('twoMode').classList.toggle('active',mode==='two');$('computerMode').setAttribute('aria-selected',mode==='computer');$('twoMode').setAttribute('aria-selected',mode==='two');$('opponentField').style.display=mode==='computer'?'none':'block';$('difficultyField').style.display=mode==='computer'?'block':'none';$('modeLabel').textContent=mode==='computer'?'VS COMPUTER':'TWO PLAYERS';newGame();}
cells.forEach(el=>el.addEventListener('click',()=>move(Number(el.dataset.i))));
$('computerMode').onclick=()=>setMode('computer');$('twoMode').onclick=()=>setMode('two');$('newGame').onclick=newGame;
$('undo').onclick=()=>{if(!history.length||over)return;let steps=(mode==='computer'&&turn==='X'&&history.length>=2)?2:1;while(steps--&&history.length){const prev=history.pop();board=prev.board;turn=prev.turn;}$('result').textContent='Last move undone.';render();};
$('resetScores').onclick=()=>{scores={X:0,O:0,D:0};persist();showScores();sayToast('Scores have been reset.');};
$('playerX').addEventListener('input',render);$('playerO').addEventListener('input',render);
$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'♫':'♪';$('soundBtn').title=sound?'Mute sound':'Enable sound';sayToast(sound?'Sound on':'Sound off');};
setMode('computer');showScores();
})();
